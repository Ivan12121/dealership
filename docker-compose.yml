version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dealer-db
    environment:
      POSTGRES_USER: dealer_user
      POSTGRES_PASSWORD: dealer_password
      POSTGRES_DB: auto_dealer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dealer-api:
    platform: linux/x86_64
    build: 
      context: ./dealer-api
      dockerfile: ../docker/dealer-api/Dockerfile
    container_name: dealer-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dealer_user
      DB_PASSWORD: dealer_password
      DB_NAME: auto_dealer
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: dealer_nginx
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dealer-api

volumes:
 pgdata: