version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dealer-db
    environment:
      POSTGRES_USER: dealer_user
      POSTGRES_PASSWORD: dealer_password
      POSTGRES_DB: auto_dealer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: dealer_nginx
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # depends_on:
    #   - dealer-api

volumes:
 pgdata: